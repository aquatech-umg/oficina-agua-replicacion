services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath ./data"
    working_dir: /home/dynamodblocal
    user: "0:0"
    ports:
      - "127.0.0.1:8011:8000"
    volumes:
      - dynamodb-data:/home/dynamodblocal/data

  dynamodb-replicacion-init:
    image: amazon/aws-cli:latest
    depends_on:
      dynamodb-local:
        condition: service_started
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-east-1
      AWS_PAGER: ""
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu

        echo "Esperando a DynamoDB Local..."
        intentos=0
        until aws dynamodb list-tables \
          --endpoint-url http://dynamodb-local:8000 >/dev/null 2>&1
        do
          intentos=$$((intentos + 1))
          if [ "$$intentos" -ge 30 ]; then
            echo "ERROR: DynamoDB Local no responde."
            exit 1
          fi
          sleep 2
        done

        if aws dynamodb describe-table \
          --table-name clientes \
          --endpoint-url http://dynamodb-local:8000 >/dev/null 2>&1
        then
          echo "La tabla clientes ya existe."
        else
          aws dynamodb create-table \
            --table-name clientes \
            --attribute-definitions AttributeName=clienteId,AttributeType=S \
            --key-schema AttributeName=clienteId,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST \
            --endpoint-url http://dynamodb-local:8000 >/dev/null
        fi

        aws dynamodb wait table-exists \
          --table-name clientes \
          --endpoint-url http://dynamodb-local:8000

        if aws dynamodb describe-table \
          --table-name pagos \
          --endpoint-url http://dynamodb-local:8000 >/dev/null 2>&1
        then
          echo "La tabla pagos ya existe."
        else
          aws dynamodb create-table \
            --table-name pagos \
            --attribute-definitions AttributeName=pagoId,AttributeType=S \
            --key-schema AttributeName=pagoId,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST \
            --endpoint-url http://dynamodb-local:8000 >/dev/null
        fi

        aws dynamodb wait table-exists \
          --table-name pagos \
          --endpoint-url http://dynamodb-local:8000

        echo "Tablas de replicacion listas."
    restart: "no"

volumes:
  dynamodb-data: