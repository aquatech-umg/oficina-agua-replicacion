spring.application.name=sync-service
server.port=8085

spring.datasource.url=jdbc:mariadb://${DB_REPLICA_HOST:127.0.0.1}:${DB_REPLICA_PORT:3307}/${DB_REPLICA_NAME:oficina_agua}
spring.datasource.username=${DB_REPLICA_USER:lectura}
spring.datasource.password=${DB_REPLICA_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.datasource.hikari.read-only=true

sync.page-size=${SYNC_PAGE_SIZE:500}