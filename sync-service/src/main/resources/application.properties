spring.application.name=sync-service
server.port=8085

# Lee el .env local (no se sube a Git): primero el de este módulo y luego el de la raíz del repo.
# optional: si no existe, arranca igual. Las variables de la consola siguen teniendo prioridad.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.datasource.url=jdbc:mariadb://${DB_REPLICA_HOST:127.0.0.1}:${DB_REPLICA_PORT:3307}/${DB_REPLICA_NAME:oficina_agua}
spring.datasource.username=${DB_REPLICA_USER:lectura}
spring.datasource.password=${DB_REPLICA_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.datasource.hikari.read-only=true

sync.page-size=${SYNC_PAGE_SIZE:500}

sync.dynamodb.endpoint=${DYNAMODB_ENDPOINT:http://127.0.0.1:8011}
sync.dynamodb.region=${AWS_REGION:us-east-1}
sync.dynamodb.access-key=${DYNAMODB_ACCESS_KEY:local}
sync.dynamodb.secret-key=${DYNAMODB_SECRET_KEY:local}